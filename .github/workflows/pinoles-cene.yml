name: Pinoles cene

on:
  schedule:
    - cron: "20 5 * * *"        # jednom dnevno
  workflow_dispatch:             # ručno pokretanje iz taba Actions
  push:
    paths:
      - "mist-defaults.json"     # kad sačuvaš nove linkove iz aplikacije

permissions:
  contents: write

concurrency:
  group: pinoles-cene
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preuzmi cene sa Pinolesa
        run: node scripts/pinoles-cene.mjs
      - name: Sačuvaj pinoles-cene.json
        run: |
          if [ -n "$(git status --porcelain pinoles-cene.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pinoles-cene.json
            git commit -m "Update Pinoles prices"
            git push
          else
            echo "Nema promena."
          fi
